# Builds an installable Android APK on every push to main.
# The APK is attached to the "latest" release, so it can be downloaded
# straight onto a phone from the repository's Releases page.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          if [ ! -d android ]; then
            flutter create . --org com.jonathangames --project-name locksmith --platforms android
          fi
          dart run tool/configure.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Sign with the project's own key (from the SIGNING_KEYSTORE secret)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the project key: updates install over the old app."
          else
            echo "::warning::No SIGNING_KEYSTORE secret yet. This build uses a temporary key, so phones must uninstall the old app first. See README: 'Updating the app'."
          fi

      - run: flutter build apk --release

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk locksmith.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest locksmith.apk \
            --title "Latest build ($(date -u +'%Y-%m-%d %H:%M') UTC)" \
            --notes "Built from ${GITHUB_SHA::7}. Download locksmith.apk on your phone to install."
