<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="game-version" content="5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locksmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a locksmith's working day, tactile, warm and a bit cheeky
   IDEA: each level is a job ticket: a key to cut, a padlock code, a door to pick, a safe to crack
   PICTURE: the lock itself, drawn large: pins and springs, wheels, a door, a dial
   COLOUR and TYPE: night-navy bench, brass, steel, red lacquer, gold accent; Fredoka
   LAYOUT: one phone column: bar, chips, timer, lock, note, three buttons */
:root{color-scheme:dark;--panel:#1c2638;--ink:#f1f4f8;--muted:#9aa7ba;--gold:#ffc23d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0,#22304a 0,#0e1522 60%,#0a0f19 100%);color:var(--ink);font:16px/1.4 Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{display:flex;align-items:center;gap:6px;padding:10px 10px 4px 14px}
.bar h1{flex:1;margin:0;font-size:clamp(17px,5vw,23px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:30px;background:#0006;color:var(--gold);font-weight:700;font-size:18px;border:0;font-family:inherit;cursor:pointer}
.ico{width:42px;height:44px;flex:none;border-radius:14px;border:0;background:#ffffff10;color:var(--muted);font-size:22px;cursor:pointer}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;min-height:32px;padding:0 10px}
.chip{padding:4px 10px;border-radius:13px;background:#ffffff0f;font-weight:600;font-size:14px;white-space:nowrap}
.timer{margin:6px 16px 0;height:24px;border-radius:12px;background:#ffffff12;position:relative;overflow:hidden}
.timer i{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:linear-gradient(90deg,#26c6da,#69f0ae)}
.timer i.warn{background:linear-gradient(90deg,#ffb300,#ff7a00)}
.timer i.hot{background:linear-gradient(90deg,#d50000,#ff5252);animation:blink .45s infinite alternate}
.timer span{position:relative;display:block;text-align:center;font:700 14px/24px Fredoka,sans-serif;color:#fff;text-shadow:0 1px 3px #000c}
.timer.paused span::after{content:' · paused';font-weight:400;opacity:.8}
#stage{flex:1;position:relative;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
.note{height:52px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px;color:var(--muted);font-size:15px;line-height:1.25}
.btns{display:flex;gap:10px;padding:2px 14px 24px}
.rb{width:74px;height:56px;border-radius:18px;border:0;background:#ffffff14;color:var(--ink);font:600 12px/1.1 Fredoka,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.rb b{font-size:20px}
.big{flex:1;height:56px;border:0;border-radius:18px;font:700 18px Fredoka,sans-serif;color:#3a1f00;background:linear-gradient(90deg,#ffb300,#ff7a00);box-shadow:0 5px 14px #ff8f0059;cursor:pointer}
.big.alt{background:#ffffff14;color:var(--ink);box-shadow:none}
.big.sm{height:48px;font-size:16px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid #80deea;outline-offset:2px}
.test{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 3px);text-align:center;font-size:12px;color:#ffffff55;pointer-events:none}
#modal{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
#modal.on{display:flex}
.card{width:100%;max-width:390px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid #ffffff14;border-radius:26px;padding:22px 20px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .25s ease-out}
.card h2{margin:0;font-size:25px;line-height:1.15}
.card p{margin:0 0 4px;color:var(--muted)}
.card .big{flex:none;width:100%}
.ticket{background:#f4ead2;color:#3b2f1c;border-radius:14px;padding:14px 16px;text-align:left;transform:rotate(-1deg);box-shadow:0 6px 16px #0007}
.ticket small{display:block;color:#8a6d3b;font-weight:600;letter-spacing:.02em}
.ticket b{font-size:19px}
.ticket q{display:block;margin-top:6px;font-style:italic}
.ticket .clue{margin-top:8px;padding:6px 10px;border:2px dashed #b08a4a;border-radius:10px;font-weight:600}
.stars{font-size:44px;letter-spacing:4px}
.stars span{color:#ffffff1f}.stars span.on{color:var(--gold)}
.how{text-align:left;display:grid;gap:9px;font-size:15px}
.how div{display:flex;gap:10px}.how i{font-style:normal;width:24px;flex:none;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools{display:grid;gap:8px;text-align:left}
.tool{display:flex;align-items:center;gap:10px;background:#ffffff0d;border-radius:14px;padding:8px 10px}
.tool>i{font-style:normal;font-size:26px;width:34px;text-align:center;flex:none}
.tool div{flex:1;font-size:13px;color:var(--muted);line-height:1.25}.tool div b{display:block;color:var(--ink);font-size:15px}
.card .tool button.big{flex:none;width:auto;min-width:76px;padding:0 12px;height:40px;font-size:15px}
.pips{letter-spacing:2px;color:var(--gold)}
.rank{font-size:15px;color:var(--gold);font-weight:700}
.credit{font-size:13px;color:var(--muted)}.credit b{color:var(--ink)}
.float{position:absolute;left:50%;top:38%;transform:translateX(-50%);font:700 26px Fredoka,sans-serif;color:var(--gold);text-shadow:0 2px 8px #000a;pointer-events:none;animation:rise 1.2s ease-out forwards;white-space:nowrap;z-index:4}
@keyframes rise{from{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}to{opacity:0;transform:translate(-50%,-60px)}}
@keyframes blink{to{opacity:.55}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@media(prefers-reduced-motion:reduce){.card,.float,.timer i.hot{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><h1 id="title">Job 1</h1><button class="pill" id="coins">● 100 ＋</button><button class="ico" id="daily" aria-label="Daily job">📅</button><button class="ico" id="shop" aria-label="Workshop">🛠</button><button class="ico" id="gear" aria-label="Settings">⚙</button></div>
  <div class="chips" id="chips"></div>
  <div class="timer" id="timer"><i id="tfill"></i><span id="tlabel">1:00</span></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="note" id="note"></div>
  <div class="btns">
    <button class="rb" id="ba"></button>
    <button class="rb" id="bb"></button>
    <button class="big" id="bm"></button>
  </div>
  <div class="test" id="testnote">Test version: ads are replaced by free rewards</div>
  <div id="modal"></div>
</div>
<script>window.__SAVE__ = null;</script>
<script>
{
// ===================================================================== shared
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }), stage = $('stage');
// Performance: Q.dpr caps canvas sharpness; Q.lite turns shadows off on slow phones.
const Q = { dpr: 2, lite: false, samples: [], lastRender: 0, hotUntil: 0, tweens: 0 };
{ const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'shadowBlur');
  Object.defineProperty(ctx, 'shadowBlur', { set(v) { d.set.call(this, Q.lite ? 0 : Math.min(v, 8)); }, get() { return d.get.call(this); } }); }
const wake = (ms = 400) => { Q.hotUntil = Math.max(Q.hotUntil, performance.now() + ms); };
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pickR = (a, r) => a[Math.floor(r() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));
const inOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const outBack = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
function tween(o, key, to, ms, ease = t => t, onStep) { const from = o[key] ?? 0, s = performance.now(); Q.tweens++; return new Promise(res => { const step = now => { const t = Math.min(1, (now - s) / ms); o[key] = from + (to - from) * ease(t); onStep && onStep(); if (t < 1) requestAnimationFrame(step); else { Q.tweens--; wake(); res(); } }; requestAnimationFrame(step); }); }
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
function lin(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
const brassV = (y0, y1) => lin(0, y0, 0, y1, ['#f3db8e', '#d9b354', '#8a6a1f']);
const steelH = (x0, x1) => lin(x0, 0, x1, 0, ['#7b8590', '#eef2f5', '#6d7680']);
function text(t, x, y, size, color, align = 'center', weight = 700, base = 'middle') { ctx.fillStyle = color; ctx.font = `${weight} ${size}px Fredoka,sans-serif`; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(t, x, y); }

// ---- sound
let ac = null;
let save = { level: 1, coins: 100, sound: true };
try { save = Object.assign(save, window.__SAVE__ || JSON.parse(localStorage.getItem('locksmith') || '{}')); } catch (e) {}
save.tools = save.tools || {}; save.stats = save.stats || {}; save.jobs = save.jobs || 0;
// Inside the Android app, AdBridge is a channel to the native code (ads, saving, copying).
const NATIVE = typeof window.AdBridge !== 'undefined' && !!window.AdBridge.postMessage;
const toNative = m => { if (NATIVE) try { window.AdBridge.postMessage(JSON.stringify(m)); } catch (e) {} };
const persist = () => { const j = JSON.stringify(save); try { localStorage.setItem('locksmith', j); } catch (e) {} toNative({ type: 'save', data: j }); };
const AD = NATIVE ? '▶ watch an ad' : 'ad, free in test';
let adSeq = 0; const adWait = {};
window.onAdResult = (id, ok) => { const f = adWait[id]; delete adWait[id]; if (f) f(!!ok); };
function rewardedAd() {
  if (!NATIVE) return Promise.resolve(true);
  return new Promise(res => { const id = ++adSeq, was = G.modal; G.modal = true; adWait[id] = ok => { G.modal = was; if (!ok) say('No ad finished, so no reward. Try again in a moment.', '#ff8a80'); res(ok); }; toNative({ type: 'rewarded', id });
    setTimeout(() => { if (adWait[id]) window.onAdResult(id, false); }, 90000); });
}
const interstitialAd = () => toNative({ type: 'interstitial' });
function copyText(t) { if (NATIVE) { toNative({ type: 'copy', text: t }); return true; } try { navigator.clipboard.writeText(t); return true; } catch (e) { return false; } }
const tool = k => save.tools[k] || 0;
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dayNum = () => Math.floor(new Date(todayStr() + 'T12:00:00').getTime() / 864e5);
const audio = () => (ac = ac || new AudioContext());
function tone(f, d = .07, type = 'triangle', v = .12, slide = 0) {
  if (!save.sound) return;
  try { const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02); } catch (e) {}
}
function noise(ms = 160, freq = 3200, vol = .18) {
  if (!save.sound) return;
  try { const a = audio(), len = Math.floor(a.sampleRate * ms / 1000), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 2; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start(); } catch (e) {}
}
const sfx = {
  tick: () => tone(2300, .015, 'square', .025),
  click: () => tone(1900, .03, 'square', .05),
  contact: () => { tone(900, .05, 'square', .12); noise(40, 1500, .15); },
  set: () => tone(1250, .06, 'triangle', .12, 1.3),
  clunk: () => { tone(140, .12, 'square', .14, .7); noise(80, 600, .2); },
  bad: () => tone(150, .22, 'sawtooth', .09, .6),
  open: () => { tone(220, .12, 'square', .1); setTimeout(() => tone(660, .2, 'triangle', .14, 1.6), 90); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .18, 'triangle', .12), i * 110)),
  coin: () => { tone(1568, .08, 'square', .05); setTimeout(() => tone(2093, .12, 'square', .05), 70); },
  boing: () => tone(320, .14, 'sine', .08, 1.8),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---- game shell state
const G = { mode: null, M: null, tier: 1, tries: 0, hints: 0, penalties: 0, busy: false, modal: false,
  timeLeft: 60, timeMax: 60, timerOn: false, lastSec: 99, streak: 0, job: null };
const FX = { parts: [], t0: 0, sparks: [], last: 0 };
const TYPES = ['key', 'combo', 'pick', 'safe', 'keypad'];
const typeOf = lv => TYPES[(lv - 1) % 5];
const tierOf = lv => Math.floor((lv - 1) / 5) + 1;
const squeeze = s => Math.round(s * Math.max(.6, 1 - (G.tier - 1) * .07) * (1 + .1 * tool('watch')) / 5) * 5;

let noteText = null, noteColor = '', noteTimer = 0;
function say(t, col = '', s = 4) { noteText = t; noteColor = col; clearTimeout(noteTimer); noteTimer = setTimeout(() => { noteText = null; ui(); }, s * 1000); ui(); }
function floatText(t, col) { const d = document.createElement('div'); d.className = 'float'; d.textContent = t; if (col) d.style.color = col; $('app').appendChild(d); setTimeout(() => d.remove(), 1300); }
function penalty(sec, why) { G.timeLeft = Math.max(0, G.timeLeft - sec); floatText(`−${sec}s`, '#ff8a80'); if (why) say(why, '#ff8a80', 4); }
function modal(html, binds) { const m = $('modal'); m.innerHTML = `<div class="card">${html}</div>`; m.classList.add('on'); G.modal = true;
  return new Promise(res => { for (const [id, val] of Object.entries(binds)) { const el = m.querySelector('#' + id); if (el) el.onclick = () => { m.classList.remove('on'); G.modal = false; res(val); }; } }); }
function burst(x, y) { const cols = ['#ffd54f', '#ff8a65', '#4dd0e1', '#aed581', '#fff', '#ba68c8'];
  FX.parts = [...Array(55)].map(() => { const a = Math.random() * 7, v = 160 + Math.random() * 330; return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 230, col: pickR(cols, Math.random), z: 3 + Math.random() * 4, s: Math.random() * 3 }; });
  FX.t0 = performance.now(); }
function sparks(x, y, n = 14) { const t0 = performance.now(); for (let j = 0; j < n; j++) { const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 60 + Math.random() * 140; FX.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t0 }); } }

// ===================================================================== jobs
const JOBS = {
  key: [['Mrs. Mwila', 'I dropped my only padlock key down the market drain! My stall opens in an hour.'],
        ['Kapiri Cycles', 'Our bike-shed padlock key snapped in half. Customers are waiting.'],
        ['Pastor Zulu', 'The church gate padlock. Nobody knows who had the last key.'],
        ['Farmer Lungu', 'A goat ate the key to the feed store. I am not joking.']],
  combo: [['Chanda, age 14', 'I forgot my school locker code. I wrote clues on the back of my exercise book so I would remember… I did not remember.'],
          ['Gym owner Musonda', 'A member reset a locker and left only these riddles on a sticky note.'],
          ['Auntie Precious', 'My suitcase lock! The flight leaves tonight. My nephew set it and sent me clues as a joke.'],
          ['The museum', 'The display case from 1974 has a puzzle lock. The curator left clues in her diary.']],
  pick: [['Mr. Banda', 'Locked out of the house with the groceries melting in the sun!'],
         ['Mama Grace’s Restaurant', 'The kitchen door jammed shut and the lunch rush starts soon.'],
         ['Dr. Phiri', 'My clinic office: the patient files are inside and my keys are… also inside.'],
         ['Student hostel, room 12', 'Roommate left for the weekend with the only key.']],
  keypad: [['Office manager Mrs. Kunda', 'The new staff room keypad. Nobody wrote the PIN down. Of course.'],
           ['Gate of Kabwe Estates', 'Residents are stuck outside the electric gate. The keys are greasy at least.'],
           ['Server room, Lusaka', 'The IT guy is on leave and the Wi-Fi is down. Everyone is panicking.'],
           ['A smart door in a mansion', 'The owner jogged out and the door locked behind him. Very smart.']],
  safe: [['Old Mr. Tembo', 'My late wife’s safe. I remember bits of the numbers, the rest is your job.'],
         ['Copperbelt Credit Union', 'The manager retired and took the combination to Livingstone.'],
         ['Hotel Victoria Falls', 'Guest in room 7 locked their passports in the room safe and forgot the code.'],
         ['A mysterious attic', 'We bought an old house and found a safe in the roof. What is inside?!']],
};
const ICON = { key: '🔑', combo: '🔢', pick: '🚪', safe: '🏦', keypad: '📟' };
const NAME = { key: 'Cut a key', combo: 'Combination padlock', pick: 'Pick a door lock', safe: 'Crack a safe', keypad: 'Electronic keypad' };
const SHORT = { key: 'Key', combo: 'Padlock', pick: 'Door', safe: 'Safe', keypad: 'Keypad' };
const RANKS = [[0, 'Apprentice'], [6, 'Junior Locksmith'], [15, 'Locksmith'], [30, 'Senior Locksmith'], [50, 'Master Locksmith'], [80, 'Safe-cracking Legend']];
const rankOf = jobs => RANKS.filter(r => jobs >= r[0]).pop()[1];
const TOOLS = [
  ['watch', '⌚', 'Wristwatch', 'Every job gets +10% time per level.'],
  ['blank', '🔑', 'Blank box', 'One extra key blank per level.'],
  ['gauge', '📏', 'Depth gauge', 'Lv1: orange lights say how many steps deeper. Lv2: red ones too.'],
  ['notebook', '📓', 'Clever notebook', 'Lv1: wrong padlock guesses cost 5 s. Lv2: crosses out digits from “nothing is correct” clues.'],
  ['pick', '🪡', 'Fine pick set', 'A wider “click” zone on door pins.'],
  ['scope', '🩺', 'Pro stethoscope', 'Bigger spikes. Lv2: you also hear when you are one number away.'],
  ['thermal', '🌡', 'Thermal battery', 'One extra thermal-camera look per level on keypads.'],
];
const TOOL_COST = [120, 300, 650];

// ===================================================================== MODE 1: key cutting
const KB = 1.35, KD = 0.16, KS = 1.50, REST = 0.05, FLAT = 0.14, TIP = 0.65, CH = 2.55, DRIVER = 0.9, TOL = 0.06;
const cutX = i => i + .5;
function profile(cuts, x) {
  const L = cuts.length + TIP; if (x < 0 || x > L) return -1;
  let h = KB; cuts.forEach((k, i) => { h = Math.min(h, KB - k * KD + Math.max(0, Math.abs(x - cutX(i)) - FLAT)); });
  return Math.min(h, (L - x) * 1.4 + .25);
}
// Draws a pin-tumbler cylinder: housing, chambers, springs, pins. bottoms[i] = key pin bottom height.
function drawCylinder(o) {
  const { x0, floor, u, n, keyPins, bottoms } = o, Y = h => floor - h * u;
  const hx0 = x0 - u * .25, hx1 = x0 + (n + .35) * u, hTop = Y(KS + CH + .2), hBot = Y(-.45);
  rr(hx0, hTop, hx1 - hx0, hBot - hTop, 8); ctx.fillStyle = '#b8923a'; ctx.fill();
  const plugTop = Y(KS + (o.plugShift || 0)), plugBot = Y(-.3);
  ctx.fillStyle = o.plugColor || '#e7c977'; rr(hx0, plugTop, hx1 - hx0, plugBot - plugTop, 6); ctx.fill();
  ctx.fillStyle = '#2a1f0c'; ctx.fillRect(hx0, Y(KB + .05), hx1 - hx0, Y(-.02) - Y(KB + .05));
  for (let i = 0; i < n; i++) {
    const cx = x0 + cutX(i) * u, pw = u * .42, kb = bottoms[i], kt = kb + keyPins[i], top = Math.max(kt, o.driverFloor ? o.driverFloor[i] : kt) + DRIVER;
    ctx.fillStyle = '#5a4415'; ctx.fillRect(cx - pw / 2 - 2, Y(KS + CH), pw + 4, Y(KB + .05) - Y(KS + CH));
    if (o.glow === i) { ctx.save(); ctx.shadowColor = '#69f0ae'; ctx.shadowBlur = 18; ctx.fillStyle = '#69f0ae55'; ctx.fillRect(cx - pw / 2 - 4, Y(KS + CH), pw + 8, Y(KB + .05) - Y(KS + CH)); ctx.restore(); }
    ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 1.6; ctx.beginPath();
    const s0 = Y(top), s1 = Y(KS + CH); ctx.moveTo(cx, s0);
    for (let c = 1; c <= 14; c++) ctx.lineTo(cx + (c % 2 ? -1 : 1) * pw * .42, s0 + (s1 - s0) * c / 14);
    ctx.stroke();
    rr(cx - pw / 2, Y(top), pw, Y(top - DRIVER) - Y(top), 3); ctx.fillStyle = steelH(cx - pw / 2, cx + pw / 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - pw / 2, Y(kt)); ctx.lineTo(cx + pw / 2, Y(kt)); ctx.lineTo(cx + pw / 2, Y(kb + .14)); ctx.lineTo(cx, Y(kb)); ctx.lineTo(cx - pw / 2, Y(kb + .14)); ctx.closePath();
    ctx.fillStyle = lin(cx - pw / 2, 0, cx + pw / 2, 0, ['#a17d2a', '#ffe9a6', '#94721f']); ctx.fill(); ctx.strokeStyle = '#00000055'; ctx.lineWidth = 1; ctx.stroke();
  }

  if (c === 'pol') await modal(`<h2>Privacy policy</h2><div class="how" style="font-size:14px">
    <div><i>📱</i><span>No account, no name, email, contacts, photos or location. Your progress is saved only on this phone.</span></div>
    <div><i>📺</i><span>Ads come from <b>Google AdMob</b>. Google may use your device’s advertising ID and IP address to show and measure ads. Change ad choices in ⚙ Settings → Privacy &amp; ad choices, or in your phone’s Google → Ads settings.</span></div>
    <div><i>🔄</i><span>The app downloads game updates from GitHub and its font from Google Fonts.</span></div>
    <div><i>🧒</i><span>Not directed at children under 13. We don’t sell personal information.</span></div></div>
    <p class="credit">Full policy:<br><b style="user-select:text">jay7255.github.io/Locksmith/privacy.html</b></p><button class="big" id="ok">Close</button>`, { ok: 1 });
  let jump = null;
  if (typeof c === 'string' && c[0] === 't') jump = (tierOf(save.level) - 1) * 5 + Number(c[1]) + 1;
  if (c === 5 || c === -5) jump = Math.max(1, save.level + c);
  if (c === 'r') { save = { level: 1, coins: 100, sound: save.sound, tools: {}, stats: {}, jobs: 0 }; jump = 1; }
  if (jump) { save.level = jump; persist(); startJob(jump); await showJob(); }
  ui();
};

$('daily').onclick = async () => {
  if (G.busy) return;
  if (save.dailyDone === todayStr()) { await modal(`<h2>📅 Daily job done</h2><p>Come back tomorrow for a new one.<br>Daily streak: ${save.dailyStreak || 1} day(s).</p><button class="big" id="ok">OK</button>`, { ok: 1 }); return; }
  if (G.daily) return;
  const c = await modal(`<h2>📅 Today’s special job</h2><p>A harder lock, the same one for every player today. Pays <b>3× coins</b>. Your current job will wait.</p>${save.dailyStreak ? `<p>Daily streak: ${save.dailyStreak}</p>` : ''}<button class="big" id="go2">Start the daily job</button><button class="big alt" id="no">Not now</button>`, { go2: 1, no: 0 });
  if (c) { startJob(save.level, true); await showJob(); }
};
$('shop').onclick = async () => {
  for (;;) {
    const st = TYPES.map(t => `${ICON[t]} ${save.stats[t] || 0}`).join(' &nbsp; ');
    const rows = TOOLS.map(([k, ic, nm, desc]) => { const lv = tool(k), cost = TOOL_COST[lv];
      return `<div class="tool"><i>${ic}</i><div><b>${nm} <span class="pips">${'●'.repeat(lv)}${'○'.repeat(3 - lv)}</span></b>${desc}</div>${lv < 3 ? `<button class="big ${save.coins < cost ? 'alt' : ''}" id="buy_${k}" ${save.coins < cost ? 'disabled' : ''}>● ${cost}</button>` : '<span class="pips">MAX</span>'}</div>`; }).join('');
    const binds = { cl: 0 }; TOOLS.forEach(([k]) => binds['buy_' + k] = k);
    const c = await modal(`<h2>🛠 Workshop</h2><p class="rank">🎖 ${rankOf(save.jobs)} · ${save.jobs} jobs done</p><p>${st}</p><div class="tools">${rows}</div><button class="big sm" id="cl">Back to work</button>`, binds);
    if (!c) break;
    const cost = TOOL_COST[tool(c)]; if (save.coins >= cost) { save.coins -= cost; save.tools[c] = tool(c) + 1; persist(); sfx.coin(); floatText('Upgraded!', '#69f0ae'); ui(); }
  }
  ui();
};
if (NATIVE) $('testnote').style.display = 'none';
startJob(save.level); requestAnimationFrame(draw);
(async () => { if (save.level === 1) await howto(); await showJob(); })();
}
</script>
</body>
</html>
